<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d32f2f">
<meta name="mobile-web-app-capable" content="yes">
<title>بازارچه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f5;--card:#fff;--tx:#1c1f23;--mut:#7a828c;--ac:#d32f2f;--ac2:#fdecec;--bd:#e5e6ea;--in:#f5f6f8;--gold:#f5b301;--goldbg:#fff8e1}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--card:#1b1e23;--tx:#eceef1;--mut:#8b939d;--ac2:#2a1716;--bd:#2c3038;--in:#23272e;--goldbg:#3a3112}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.6;padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hdr{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 12px 8px}
.logo{font-weight:800;font-size:19px;color:var(--ac);text-align:center}
.search input{width:100%;background:var(--in);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
.locbar{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;font-size:13px;color:var(--mut)}
.locbar button{background:none;border:0;font-size:13px;color:var(--ac);font-weight:700}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px 10px 6px;background:var(--card);margin-bottom:8px}
.cat{background:none;border:0;padding:6px 2px;text-align:center;font-size:11px;display:grid;justify-items:center;gap:4px}
.cat i{font-style:normal;font-size:26px;width:52px;height:52px;border-radius:14px;background:var(--in);display:grid;place-items:center}
.cat[aria-pressed="true"] i{background:var(--ac2);outline:2px solid var(--ac)}
.cat[aria-pressed="true"]{color:var(--ac);font-weight:700}
.sec{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-weight:700;font-size:14px}
.sec small{color:var(--mut);font-weight:400}
.sortbar{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto}
.sortbar button{flex:none;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:4px 12px;font-size:12px}
.sortbar button[aria-pressed="true"]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.list{background:var(--card);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.ad{display:flex;gap:10px;padding:12px;border-bottom:1px solid var(--bd);cursor:pointer;position:relative}
.ad.vip{background:linear-gradient(90deg,var(--goldbg),var(--card) 60%)}
.th{flex:none;width:104px;height:88px;border-radius:10px;background:var(--in);display:grid;place-items:center;font-size:32px;position:relative;overflow:hidden}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ai{flex:1;min-width:0;display:grid;gap:3px;align-content:start}
.at{font-size:14px;font-weight:700;line-height:1.5;padding-inline-end:24px}
.ap{font-size:13px;font-weight:700}
.am{font-size:12px;color:var(--mut)}
.badge{display:inline-block;background:var(--gold);color:#3b2d00;border-radius:6px;font-size:11px;font-weight:800;padding:0 6px;margin-inline-start:4px}
.fav{position:absolute;top:10px;left:8px;background:none;border:0;font-size:18px;color:var(--mut);padding:2px}
.fav.on{color:var(--ac)}
.empty{text-align:center;color:var(--mut);padding:50px 14px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
.nav button{background:none;border:0;font-size:11px;color:var(--mut);display:grid;justify-items:center;gap:1px;flex:1}
.nav button i{font-style:normal;font-size:20px;line-height:1.2}
.nav button[aria-current="true"]{color:var(--ac);font-weight:700}
dialog{border:0;border-radius:18px;padding:0;width:min(560px,94vw);max-height:92vh;background:var(--card);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.box{padding:16px;display:grid;gap:10px}
.box h2{margin:0;font-size:17px}
label{display:grid;gap:4px;font-size:12px;color:var(--mut)}
input,select,textarea{background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%;color:var(--tx);font-size:14px}
input[type=file]{padding:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;text-align:center;text-decoration:none;display:inline-block;font-size:14px}
.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn.gold{background:var(--gold);color:#3b2d00}
.btn.sm{padding:6px 10px;font-size:12px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar>*{flex:1;min-width:30%;text-align:center}
.vipbox{display:flex;gap:10px;align-items:flex-start;background:var(--goldbg);border:1px solid var(--gold);border-radius:12px;padding:10px;font-size:12px;color:var(--tx)}
.vipbox input{width:auto;margin-top:3px}
.prev{width:100%;max-height:200px;object-fit:cover;border-radius:10px;display:block}
.big{height:240px;background:var(--in);display:grid;place-items:center;font-size:60px;position:relative;overflow:hidden}
.big img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dprice{color:var(--ac);font-size:20px;font-weight:800}
.note{font-size:12px;color:var(--mut);margin:0}
.lrow{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border:0;border-bottom:1px solid var(--bd);background:none;width:100%;text-align:right;font-size:14px}
.lrow[aria-pressed="true"]{color:var(--ac);font-weight:700}
.sub{padding-inline-start:16px;background:var(--in)}
.sub .lrow{font-size:13px}
.menu{background:var(--card);border-radius:14px;overflow:hidden;margin:10px}
.menu button{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-bottom:1px solid var(--bd);padding:13px 14px;font-size:14px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
#toast.show{opacity:1}
</style>
</head>
<body>
<header class="hdr" id="hdr">
  <div class="logo">بازارچه</div>
  <div class="search"><input id="q" type="search" placeholder="جستجو در همهٔ آگهی‌ها…" aria-label="جستجو"></div>
  <div class="locbar">موقعیت: <b id="locLbl" style="color:var(--ac)">کل ایران</b> <button id="locBtn">تغییر</button></div>
</header>

<main id="pHome">
  <div class="cats" id="cats"></div>
  <div class="sec"><span>آگهی‌ها</span><small id="count"></small></div>
  <div class="sortbar" id="sortbar">
    <button data-s="new" aria-pressed="true">جدیدترین</button>
    <button data-s="cheap" aria-pressed="false">ارزان‌ترین</button>
    <button data-s="exp" aria-pressed="false">گران‌ترین</button>
  </div>
  <div class="list" id="list"></div>
</main>

<main id="pFavs" hidden>
  <div class="sec"><span>نشان‌شده‌ها</span></div>
  <div class="list" id="favList"></div>
</main>

<main id="pChat" hidden>
  <div class="sec"><span>چت و تماس</span></div>
  <div class="empty">این بخش به‌زودی فعال می‌شود. برای تماس با آگهی‌دهنده، از صفحهٔ آگهی استفاده کنید.</div>
</main>

<main id="pMine" hidden>
  <div class="sec"><span>دیوار من</span></div>
  <div class="menu">
    <button data-m="myads"><span>آگهی‌های من</span><span>‹</span></button>
    <button data-m="favs"><span>نشان‌ها</span><span>‹</span></button>
    <button data-m="about"><span>درباره بازارچه</span><span>‹</span></button>
  </div>
  <div class="list" id="mineList" hidden></div>
</main>

<nav class="nav" id="nav">
  <button data-p="home" aria-current="true"><i>🏠</i>آگهی‌ها</button>
  <button data-p="favs"><i>🔖</i>نشان‌ها</button>
  <button data-p="add"><i>⊕</i>ثبت آگهی</button>
  <button data-p="chat"><i>💬</i>چت و تماس</button>
  <button data-p="mine"><i>👤</i>دیوار من</button>
</nav>

<div id="toast"></div>

<dialog id="locD"><div class="box" style="gap:0">
  <div class="row" style="grid-template-columns:auto 1fr;align-items:center;margin-bottom:8px"><button class="btn ghost sm" id="locX">بستن</button><h2 style="text-align:center">انتخاب موقعیت</h2></div>
  <input id="locQ" placeholder="جستجو در شهرهای ایران…" style="margin-bottom:8px">
  <div id="locList" style="max-height:60vh;overflow:auto"></div>
  <div style="padding-top:10px"><button class="btn" id="locOk" style="width:100%">تأیید</button></div>
</div></dialog>

<dialog id="viewD"><div class="box" id="viewBox" style="padding:0;gap:0"></div></dialog>

<dialog id="formD"><div class="box">
  <h2>ثبت آگهی جدید</h2>
  <label>عکس آگهی (دوربین یا گالری)
    <input type="file" id="f_file" accept="image/*" capture="environment">
  </label>
  <img id="f_prev" class="prev" hidden alt="">
  <label>عنوان آگهی<input id="f_t" maxlength="60" placeholder="مثلاً: گوشی سامسونگ A54"></label>
  <div class="row">
    <label>قیمت (تومان)<input id="f_p" inputmode="numeric" placeholder="خالی = توافقی"></label>
    <label>دسته‌بندی<select id="f_c"></select></label>
  </div>
  <div class="row">
    <label>شهر<select id="f_city"></select></label>
    <label>شماره تماس<input id="f_ph" inputmode="tel" placeholder="09123456789"></label>
  </div>
  <label>توضیحات<textarea id="f_d" rows="3" maxlength="400"></textarea></label>
  <label class="vipbox"><input type="checkbox" id="f_v"><span><b>آگهی ویژه (۵۰٬۰۰۰ تومان)</b><br>بالای فهرست با نشان طلایی نمایش داده می‌شود. پرداخت آزمایشی است.</span></label>
  <p class="note" id="err" style="color:#d32f2f"></p>
  <div class="bar"><button class="btn ghost" id="cancelBtn">انصراف</button><button class="btn" id="saveBtn">انتشار آگهی</button></div>
</div></dialog>

<script>
const CATS=[["خانه و آشپزخانه","🛋️"],["کالای دیجیتال","📱"],["وسایل نقلیه","🚗"],["املاک","🏠"],["سرگرمی و فراغت","🎮"],["اجتماعی","👥"],["وسایل شخصی","⌚"],["خدمات","🛠️"],["استخدام و کاریابی","💼"],["تجهیزات و صنعتی","🔧"]];
const PROVINCES={
"آذربایجان شرقی":["تبریز","مراغه","میانه","مرند"],"آذربایجان غربی":["ارومیه","خوی","مهاباد","میاندوآب"],
"اردبیل":["اردبیل","پارس‌آباد","مشگین‌شهر"],"اصفهان":["اصفهان","کاشان","نجف‌آباد","خمینی‌شهر","شاهین‌شهر"],
"البرز":["کرج","فردیس","نظرآباد"],"ایلام":["ایلام","دهلران","مهران"],"بوشهر":["بوشهر","کنگان","گناوه"],
"تهران":["تهران","اسلام‌شهر","ری","شهریار","ورامین","پردیس","پاکدشت","رباط‌کریم"],
"چهارمحال و بختیاری":["شهرکرد","بروجن","فارسان"],"خراسان جنوبی":["بیرجند","قائن"],
"خراسان رضوی":["مشهد","نیشابور","سبزوار","تربت‌حیدریه","قوچان"],"خراسان شمالی":["بجنورد","شیروان"],
"خوزستان":["اهواز","آبادان","خرمشهر","دزفول","اندیمشک","ماهشهر"],"زنجان":["زنجان","ابهر","خرمدره"],
"سمنان":["سمنان","شاهرود","دامغان"],"سیستان و بلوچستان":["زاهدان","چابهار","زابل","ایرانشهر"],
"فارس":["شیراز","مرودشت","کازرون","جهرم","لار"],"قزوین":["قزوین","تاکستان"],"قم":["قم"],
"کردستان":["سنندج","سقز","مریوان"],"کرمان":["کرمان","رفسنجان","جیرفت","سیرجان"],
"کرمانشاه":["کرمانشاه","اسلام‌آباد غرب","سنقر"],"کهگیلویه و بویراحمد":["یاسوج","دوگنبدان"],
"گلستان":["گرگان","گنبد کاووس","علی‌آباد کتول"],"گیلان":["رشت","انزلی","لاهیجان","لنگرود","آستارا"],
"لرستان":["خرم‌آباد","بروجرد","دورود"],"مازندران":["ساری","بابل","آمل","قائم‌شهر","نوشهر","چالوس"],
"مرکزی":["اراک","ساوه","خمین"],"هرمزگان":["بندرعباس","قشم","میناب"],"همدان":["همدان","ملایر","نهاوند"],"یزد":["یزد","میبد","اردکان"]
};
const H=36e5,now=Date.now();
const SEED=[
{id:"s1",t:"پژو ۲۰۶ تیپ ۵، سالم",p:385000000,c:"وسایل نقلیه",city:"تهران",ph:"09120000001",d:"مدل ۱۳۹۸، بدون رنگ، بیمه ۶ ماه.",vip:1,ts:now-2*H,owner:"seed"},
{id:"s2",t:"گوشی سامسونگ A54",p:14500000,c:"کالای دیجیتال",city:"اصفهان",ph:"09130000002",d:"یک سال کارکرد، با جعبه و گارانتی.",vip:0,ts:now-5*H,owner:"seed"},
{id:"s3",t:"یخچال ساید بای ساید",p:28000000,c:"خانه و آشپزخانه",city:"مشهد",ph:"09150000003",d:"تمیز، دو سال کارکرد.",vip:0,ts:now-30*H,owner:"seed"},
{id:"s4",t:"نقاشی ساختمان و دکوراسیون",p:0,c:"خدمات",city:"شیراز",ph:"09170000004",d:"با ضمانت کار، قیمت توافقی.",vip:0,ts:now-60*H,owner:"seed"}];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fa=n=>Number(n).toLocaleString("fa-IR");
const digits=s=>s.replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
const icon=c=>(CATS.find(x=>x[0]===c)||[0,"📦"])[1];
const okImg=u=>/^data:image\//.test(u||"")||/^https?:\/\//.test(u||"");
const priceTxt=a=>a.p?fa(a.p)+" تومان":"توافقی";
function ls(k,d){try{const r=localStorage.getItem(k);return r?JSON.parse(r):d}catch(e){return d}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
let ads=ls("bz_ads",SEED),favs=ls("bz_favs",[]),uid=ls("bz_uid","");
if(!uid){uid="u"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);ss("bz_uid",uid)}
let cat="",sort="new",loc={t:"all"},pendingImg="";
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
const saveAds=()=>{if(!ss("bz_ads",ads))toast("حافظه پر است؛ عکس‌های کمتری استفاده کنید")};
function ago(ts){const m=Math.floor((Date.now()-ts)/6e4);if(m<2)return"چند لحظه پیش";if(m<60)return fa(m)+" دقیقه پیش";const h=Math.floor(m/60);if(h<24)return fa(h)+" ساعت پیش";return fa(Math.floor(h/24))+" روز پیش"}
const locName=()=>loc.t==="all"?"کل ایران":loc.v;
function matchLoc(a){
  if(loc.t==="all")return true;
  if(loc.t==="city")return a.city===loc.v;
  return (PROVINCES[loc.v]||[]).includes(a.city);
}
function row(a){
  const img=okImg(a.img)?`<img src="${esc(a.img)}" alt="" onerror="this.remove()">`:"";
  return `<div class="ad ${a.vip?"vip":""}" data-id="${esc(a.id)}">
  <div class="th">${img}<span>${icon(a.c)}</span></div>
  <div class="ai"><div class="at">${esc(a.t)}${a.vip?'<span class="badge">ویژه</span>':""}</div>
  <div class="ap">${priceTxt(a)}</div>
  <div class="am">${esc(a.city)} · ${ago(a.ts)}</div></div>
  <button class="fav ${favs.includes(a.id)?"on":""}" data-f="${esc(a.id)}" aria-label="نشان کردن">${favs.includes(a.id)?"♥":"♡"}</button>
  </div>`;
}
const sorted=l=>l.sort((a,b)=>(b.vip-a.vip)||(sort==="cheap"?(a.p||1e18)-(b.p||1e18):sort==="exp"?b.p-a.p:b.ts-a.ts));
function renderHome(){
  $("#cats").innerHTML=CATS.map(([n,i])=>`<button class="cat" aria-pressed="${n===cat}" data-c="${n}"><i>${i}</i>${n}</button>`).join("");
  const q=$("#q").value.trim();
  const l=sorted(ads.filter(a=>(!cat||a.c===cat)&&matchLoc(a)&&(!q||(a.t+a.d+a.city).includes(q))));
  $("#count").textContent=fa(l.length)+" آگهی";
  $("#list").innerHTML=l.length?l.map(row).join(""):`<div class="empty">آگهی‌ای پیدا نشد. اولین آگهی را ثبت کنید.</div>`;
  document.querySelectorAll("#sortbar button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===sort));
  $("#locLbl").textContent=locName();
}
function renderFavs(){
  const l=sorted(ads.filter(a=>favs.includes(a.id)));
  $("#favList").innerHTML=l.length?l.map(row).join(""):`<div class="empty">هنوز آگهی‌ای را نشان نکرده‌اید. روی ♡ بزنید.</div>`;
}
function renderMine(){
  const l=sorted(ads.filter(a=>a.owner===uid));
  $("#mineList").hidden=false;
  $("#mineList").innerHTML=l.length?l.map(row).join(""):`<div class="empty">هنوز آگهی‌ای ثبت نکرده‌اید.</div>`;
}
function go(p){
  if(p==="add")return openForm();
  const map={home:"#pHome",favs:"#pFavs",chat:"#pChat",mine:"#pMine"};
  Object.values(map).forEach(s=>$(s).hidden=true);
  $(map[p]).hidden=false;
  document.querySelectorAll("#nav [data-p]").forEach(b=>b.setAttribute("aria-current",b.dataset.p===p));
  $("#hdr").hidden=p!=="home";
  if(p==="home")renderHome();
  if(p==="favs")renderFavs();
  if(p==="mine"){$("#mineList").hidden=true}
  window.scrollTo(0,0);
}
function toggleFav(id){favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];ss("bz_favs",favs)}
function openAd(id){
  const a=ads.find(x=>x.id===id);if(!a)return;
  const mine=a.owner===uid,f=favs.includes(id);
  const img=okImg(a.img)?`<img src="${esc(a.img)}" alt="">`:"";
  $("#viewBox").innerHTML=`<div class="big">${img}<span style="position:relative">${icon(a.c)}</span></div>
  <div style="padding:14px;display:grid;gap:8px">
  <h2 style="margin:0;font-size:17px">${esc(a.t)}${a.vip?' <span class="badge">ویژه</span>':""}</h2>
  <div class="dprice">${priceTxt(a)}</div>
  <div class="am">${esc(a.city)} · ${esc(a.c)} · ${ago(a.ts)}</div>
  <p style="margin:4px 0">${esc(a.d||"توضیحی ثبت نشده.")}</p>
  <div class="bar"><a class="btn" href="tel:${esc(a.ph)}">تماس</a><a class="btn ghost" href="sms:${esc(a.ph)}">پیامک</a><button class="btn ghost" data-a="fav">${f?"♥ نشان‌شده":"♡ نشان کن"}</button><button class="btn ghost" data-a="share">اشتراک</button></div>
  ${mine?`<div class="bar"><button class="btn gold sm" data-a="bump">بالا آوردن (۲۰٬۰۰۰ ت، آزمایشی)</button>${a.vip?"":'<button class="btn gold sm" data-a="vip">ویژه کردن (۵۰٬۰۰۰ ت، آزمایشی)</button>'}<button class="btn ghost sm" data-a="del">حذف</button></div>`:""}
  <button class="btn ghost sm" data-a="close">بستن</button></div>`;
  $("#viewBox").onclick=e=>{
    const b=e.target.closest("[data-a]");if(!b)return;const k=b.dataset.a;
    if(k==="close")return $("#viewD").close();
    if(k==="fav"){toggleFav(id);renderHome();return openAd(id)}
    if(k==="share"){const tx=a.t+" — "+priceTxt(a)+" — "+a.city+"\nتماس: "+a.ph;
      if(navigator.share)navigator.share({title:a.t,text:tx}).catch(()=>{});
      else if(navigator.clipboard)navigator.clipboard.writeText(tx).then(()=>toast("متن آگهی کپی شد"));
      return}
    if(k==="bump"){a.ts=Date.now();saveAds();renderHome();toast("آگهی بالا آمد");return openAd(id)}
    if(k==="vip"){a.vip=1;a.ts=Date.now();saveAds();renderHome();toast("آگهی ویژه شد");return openAd(id)}
    if(k==="del"){ads=ads.filter(x=>x.id!==id);favs=favs.filter(x=>x!==id);ss("bz_favs",favs);saveAds();renderHome();$("#viewD").close();go("mine")}
  };
  $("#viewD").showModal();
}
let locTmp={t:"all"},openProv=null;
function renderLoc(){
  const q=$("#locQ").value.trim();
  let h=`<button class="lrow" aria-pressed="${locTmp.t==="all"}" data-l="all"><span>کل ایران</span><span>${locTmp.t==="all"?"✔":""}</span></button>`;
  if(q){
    h+=Object.values(PROVINCES).flat().filter(c=>c.includes(q)).map(c=>`<button class="lrow" aria-pressed="${locTmp.v===c}" data-l="city:${esc(c)}"><span>${esc(c)}</span><span>${locTmp.v===c?"✔":""}</span></button>`).join("");
  }else{
    h+=Object.entries(PROVINCES).map(([p,cs])=>{
      const open=openProv===p;
      const sub=open?`<div class="sub"><button class="lrow" data-l="prov:${esc(p)}"><span>همه شهرهای ${esc(p)}</span><span>${locTmp.v===p?"✔":""}</span></button>`+cs.map(c=>`<button class="lrow" aria-pressed="${locTmp.v===c}" data-l="city:${esc(c)}"><span>${esc(c)}</span><span>${locTmp.v===c?"✔":""}</span></button>`).join("")+`</div>`:"";
      return `<button class="lrow" data-open="${esc(p)}"><span>${esc(p)}</span><span>${open?"⌄":"‹"}</span></button>${sub}`;
    }).join("");
  }
  $("#locList").innerHTML=h;
}
$("#locBtn").onclick=()=>{locTmp={...loc};openProv=null;$("#locQ").value="";renderLoc();$("#locD").showModal()};
$("#locX").onclick=()=>$("#locD").close();
$("#locQ").oninput=renderLoc;
$("#locList").onclick=e=>{
  const o=e.target.closest("[data-open]");
  if(o){openProv=openProv===o.dataset.open?null:o.dataset.open;renderLoc();return}
  const b=e.target.closest("[data-l]");if(!b)return;
  const [t,v]=b.dataset.l.split(/:(.*)/s);
  locTmp=t==="city"||t==="prov"?{t,v}:{t:"all"};renderLoc();
};
$("#locOk").onclick=()=>{loc={...locTmp};$("#locD").close();renderHome()};
$("#f_city").innerHTML=Object.entries(PROVINCES).map(([p,cs])=>`<optgroup label="${p}">${cs.map(c=>`<option>${c}</option>`).join("")}</optgroup>`).join("");
$("#f_c").innerHTML=CATS.map(([n])=>`<option>${n}</option>`).join("");
function openForm(){$("#err").textContent="";$("#formD").showModal()}
function readPhoto(file,cb){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const s=Math.min(1,900/Math.max(im.width,im.height));
    const c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",0.72));
  };im.src=r.result};
  r.readAsDataURL(file);
}
$("#f_file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  readPhoto(f,d=>{pendingImg=d;$("#f_prev").src=d;$("#f_prev").hidden=false});
};
$("#cancelBtn").onclick=()=>$("#formD").close();
$("#saveBtn").onclick=()=>{
  const t=$("#f_t").value.trim(),ph=digits($("#f_ph").value.trim()).replace(/[\s-]/g,"");
  if(t.length<3)return $("#err").textContent="عنوان آگهی را بنویسید.";
  if(!/^0?9\d{9}$|^0\d{10}$/.test(ph))return $("#err").textContent="شماره تماس معتبر وارد کنید.";
  const p=parseInt(digits($("#f_p").value).replace(/\D/g,""))||0;
  ads.unshift({id:"a"+Date.now(),t,p,c:$("#f_c").value,city:$("#f_city").value,ph,d:$("#f_d").value.trim(),img:pendingImg,vip:$("#f_v").checked?1:0,ts:Date.now(),owner:uid});
  saveAds();$("#formD").close();toast("آگهی منتشر شد");
  ["f_t","f_p","f_ph","f_d"].forEach(i=>$("#"+i).value="");
  $("#f_v").checked=false;pendingImg="";$("#f_prev").hidden=true;$("#f_file").value="";
  go("mine");
};
$("#cats").onclick=e=>{const b=e.target.closest(".cat");if(!b)return;cat=cat===b.dataset.c?"":b.dataset.c;renderHome()};
$("#sortbar").onclick=e=>{const b=e.target.closest("button");if(!b)return;sort=b.dataset.s;renderHome()};
$("#q").oninput=renderHome;
$("#nav").onclick=e=>{const b=e.target.closest("[data-p]");if(b)go(b.dataset.p)};
$("#pMine").onclick=e=>{
  const b=e.target.closest("[data-m]");if(!b)return;
  const m=b.dataset.m;
  if(m==="myads"){renderMine()}
  if(m==="favs")go("favs");
  if(m==="about")toast("بازارچه — نسخهٔ آزمایشی");
};
document.querySelectorAll(".list,#favList,#mineList").forEach(el=>el.onclick=e=>{
  const f=e.target.closest(".fav");
  if(f){e.stopPropagation();toggleFav(f.dataset.f);renderFavs();renderHome();return}
  const c=e.target.closest(".ad");if(c)openAd(c.dataset.id);
});
renderHome();
</script>
</body>
</html>
